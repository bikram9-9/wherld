<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wherld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a detective's night desk. The lit globe is the hero on the left;
   the paper case file (clues, redacted until earned) sits on the right. One theme by choice. */
:root {
  color-scheme: dark;
  --ink: #0e1a25;          /* desk */
  --panel: #152634;        /* raised surfaces */
  --line: #2a4155;         /* hairlines */
  --text: #e6ecf1;
  --muted: #8ea3b5;
  --paper: #ebe2cc;        /* case file */
  --paper-ink: #1c2733;
  --paper-line: #cdbf9f;
  --amber: #f2a23a;        /* accent: desk lamp */
  --hot: #e2502e;
  --cold: #7fb4d6;
  --solved: #3fae6b;
  --font-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.wrap { max-width: 1280px; margin: 0 auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 4vw, 36px); line-height: 1; margin: 0; letter-spacing: -0.02em; }
.brand h1 span { color: var(--amber); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 64ch; }
@media (max-width: 820px) { .brand p { display: none; } }
.controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--amber); color: #1b1304; }
.streak { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.streak b { color: var(--text); font-weight: 600; }

main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.85fr); gap: 28px; align-items: start; }

/* Globe column */
.globe-col { display: flex; flex-direction: column; gap: 10px; }
.guessbar { display: flex; flex-direction: column; gap: 6px; }
.globe-box { position: relative; width: 100%; max-width: min(560px, max(230px, 100dvh - 215px)); margin: 0 auto; aspect-ratio: 1; }
@media (max-width: 820px) { .globe-box { max-width: min(100%, max(220px, 46dvh)); } }
#globe { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; border-radius: 50%; }
#globe.dragging { cursor: grabbing; }
.toast { position: absolute; top: 6px; left: 50%; z-index: 3; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; white-space: nowrap; font-family: var(--font-display); font-weight: 800; font-size: 18px; padding: 6px 16px; border-radius: 999px; background: var(--panel); color: var(--text); border: 2px solid var(--line); box-shadow: 0 10px 24px rgba(0,0,0,0.45); transition: opacity 0.25s, transform 0.25s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.warmer { background: #c20d1a; border-color: #ffb199; color: #fff; }
.toast.colder { background: #0a2a8f; border-color: #a9cbff; color: #fff; }
.toast.same { background: var(--panel); border-color: var(--muted); color: var(--text); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
.zoom { position: absolute; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 20px; line-height: 1; }
.zoom button:hover { border-color: var(--amber); }
.legend { position: absolute; left: 0; bottom: 4px; display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.legend i { display: block; width: 84px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #0a2a8f, #9fc3ff 50%, #ffada3 50%, #c20d1a); }

.guess-form { position: relative; display: flex; gap: 8px; max-width: 560px; width: 100%; margin: 0 auto; }
.guess-form input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.guess-form input::placeholder { color: var(--muted); }
.guess-form input:focus { outline: none; border-color: var(--amber); }
.guess-form button { border: 0; border-radius: 10px; padding: 0 20px; background: var(--amber); color: #1b1304; font-weight: 600; }
.guess-form button:disabled, .guess-form input:disabled { opacity: 0.5; cursor: not-allowed; }
#suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; margin: 0; padding: 4px; list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-height: 240px; overflow-y: auto; box-shadow: 0 12px 30px rgba(0,0,0,0.45); }
#suggest[hidden] { display: none; }
#suggest li { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
#suggest li[aria-selected="true"], #suggest li:hover { background: #20384b; }
#suggest li.used { color: var(--muted); text-decoration: line-through; }
.msg { min-height: 1.4em; margin: 0 auto; max-width: 560px; width: 100%; font-size: 14px; color: var(--text); }
.msg b { color: var(--amber); font-weight: 600; }

/* Case file */
.file-col { display: flex; flex-direction: column; gap: 14px; }
.casefile { position: relative; background: var(--paper); color: var(--paper-ink); border-radius: 4px 14px 4px 4px; padding: 10px 14px 2px; box-shadow: 0 18px 40px rgba(0,0,0,0.4); }
.casefile::before { content: ""; position: absolute; top: -10px; left: 18px; width: 120px; height: 12px; background: var(--paper); border-radius: 6px 6px 0 0; }
.cf-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--paper-ink); }
.cf-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 16px; margin: 0; letter-spacing: -0.01em; }
.cf-head span { font-family: var(--font-mono); font-size: 12px; }
.clues { list-style: none; margin: 0; padding: 0; }
.clues li { display: grid; grid-template-columns: 20px 100px minmax(0, 1fr); gap: 8px; align-items: center; min-height: 30px; padding: 4px 0; border-bottom: 1px dashed var(--paper-line); }
.clues li:last-child { border-bottom: 0; }
.clues .n { font-family: var(--font-mono); font-size: 11px; font-weight: 600; width: 18px; height: 18px; border: 1.5px solid var(--paper-ink); border-radius: 50%; display: grid; place-items: center; }
.clues .k { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.clues .v { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.locknote { display: none; margin: 0; padding: 6px 0 8px; font-family: var(--font-mono); font-size: 12px; opacity: 0.75; }
@media (max-width: 820px) { .locknote:not([hidden]) { display: block; } }
.clues li.locked .n, .clues li.locked .k { opacity: 0.55; }
.redact { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.redact i { display: block; height: 12px; background: var(--paper-ink); border-radius: 2px; }
.redact small { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }
.clues li.fresh .v { animation: reveal 0.5s ease-out; }
@keyframes reveal { from { background: var(--paper-ink); color: transparent; } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .clues li.fresh .v { animation: none; } }
.swatches { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.swatches span { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
.swatches i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--paper-ink); }
#shape { width: 92px; height: 62px; display: block; }
@media (max-width: 440px) { .clues li { grid-template-columns: 20px 92px minmax(0, 1fr); gap: 8px; } .clues .k { font-size: 11px; letter-spacing: 0.02em; } }

.verdict { margin: 2px 0 8px; padding: 10px 0 4px; border-top: 2px solid var(--paper-ink); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.verdict #scoreline, .verdict .row, .verdict #sharebox { flex-basis: 100%; }
.verdict[hidden] { display: none; }
.stamp { font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 12px; border: 3px solid currentColor; border-radius: 6px; transform: rotate(-3deg); }
.stamp.win { color: #1f7a45; }
.stamp.loss { color: #b23a20; }
.verdict p { margin: 0; }
.verdict .ans { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.1; }
.verdict .row { display: flex; flex-wrap: wrap; gap: 8px; }
.verdict button { border: 1.5px solid var(--paper-ink); background: transparent; color: var(--paper-ink); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.verdict button.primary { background: var(--paper-ink); color: var(--paper); }
#sharebox { width: 100%; font-family: var(--font-mono); font-size: 13px; background: #f6f0e0; color: var(--paper-ink); border: 1px solid var(--paper-line); border-radius: 6px; padding: 8px; resize: none; }
#sharebox[hidden] { display: none; }

.guesses h3 { font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; }
.guesses ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.guesses li button { display: inline-flex; gap: 8px; align-items: center; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 14px; }
.guesses li button:hover { border-color: var(--muted); }
.guesses .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.guesses .nm { font-weight: 500; }
.guesses .ds { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.guesses .ar { font-size: 15px; }
.guesses .empty { color: var(--muted); font-size: 13px; }

/* Stage: the globe owns the screen; the case file and guess list float in its empty corners */
main.stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.guessbar { width: 100%; max-width: 520px; }
.globe-box { max-width: none; aspect-ratio: auto; height: max(260px, 100dvh - 212px); overflow: hidden; border-radius: 14px; }
#globe { border-radius: 0; }
.legend { left: 8px; bottom: 8px; }
.zoom { right: 8px; bottom: 8px; }
.casefile { position: absolute; top: 14px; right: 0; z-index: 4; width: 246px; min-height: 246px; transform: rotate(1.4deg); border-radius: 3px 12px 3px 3px; box-shadow: 5px 5px 0 -1px #cdbf9f, 9px 9px 0 -2px #b9aa87, 0 20px 40px rgba(0,0,0,0.5); }
.casefile::before { width: 96px; left: 12px; }
.clues li { grid-template-columns: 18px 72px minmax(0, 1fr); gap: 7px; }
.clues .k { font-size: 10px; letter-spacing: 0.03em; }
.clues .v { font-size: 13px; line-height: 1.25; }
.redact small { display: none; }
.guesses { position: absolute; top: 4px; left: 0; z-index: 4; width: 220px; }
.guesses ol { flex-direction: column; align-items: flex-start; }
.guessbar { max-width: 340px; gap: 4px; }
.guess-form input { padding: 7px 12px; font-size: 14px; border-radius: 8px; }
.guess-form button { padding: 0 14px; font-size: 14px; border-radius: 8px; }
.msg { font-size: 13px; text-align: center; }
@media (max-width: 900px) {
  .guessbar { position: sticky; top: 0; z-index: 6; max-width: none; background: var(--ink); padding: 8px 0 4px; box-shadow: 0 12px 16px -8px var(--ink); }
  .globe-box { height: min(calc(100vw - 32px), 62dvh); }
  .guesses { position: static; }
  .casefile { position: relative; top: 0; }
  .casefile, .guesses { transform: none; width: 100%; max-width: 440px; min-height: 0; }
  .casefile { margin-top: 14px; }
  .guesses ol { flex-direction: row; }
  .clues li.locked { display: none; }
  .locknote:not([hidden]) { display: block; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Wher<span>ld</span></h1>
      <p>Where in the world? One mystery country, six guesses. Every miss unlocks a new clue and colors the globe by how close you were.</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Game mode">
        <button type="button" id="mode-daily" aria-pressed="true">Daily case</button>
        <button type="button" id="mode-practice" aria-pressed="false">Practice</button>
      </div>
      <div class="streak" id="streak"></div>
    </div>
  </header>

  <main class="stage">
      <div class="guessbar">
      <form class="guess-form" id="form" autocomplete="off">
        <input id="guess" type="text" placeholder="Type a country" aria-label="Guess a country" role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list" spellcheck="false">
        <button type="submit" id="go">Guess</button>
        <ul id="suggest" role="listbox" hidden></ul>
      </form>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      </div>
      <div class="globe-box">
        <div class="toast" id="toast" aria-hidden="true"></div>
        <canvas id="globe" aria-label="Globe. Drag to spin. Guessed countries are colored by distance from the answer."></canvas>
        <div class="legend"><span>far</span><i></i><span>close</span></div>
        <div class="zoom">
          <button type="button" id="zin" aria-label="Zoom in">+</button>
          <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
        </div>
      </div>
      <div class="casefile">
        <div class="cf-head"><h2>Case file</h2><span id="caseno"></span></div>
        <ol class="clues" id="clues"></ol>
        <p class="locknote" id="locknote"></p>
        <div class="verdict" id="verdict" hidden>
          <div class="stamp" id="stamp"></div>
          <p class="ans" id="ans"></p>
          <p id="scoreline"></p>
          <div class="row">
            <button type="button" class="primary" id="copy">Copy result</button>
            <button type="button" id="again">Play a practice round</button>
          </div>
          <textarea id="sharebox" rows="3" readonly hidden aria-label="Your result, ready to copy"></textarea>
        </div>
      </div>
      <div class="guesses">
        <h3><span>Your guesses</span><span id="left"></span></h3>
        <ol id="glist"></ol>
      </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

      if (state.guesses.includes(c.key)) li.classList.add("used");
      li.addEventListener("pointerdown", (e) => { e.preventDefault(); pick(c); });
      list.append(li);
    });
    list.hidden = !items.length; input.setAttribute("aria-expanded", !!items.length);
  }
  function hide() { list.hidden = true; input.setAttribute("aria-expanded", "false"); }
  function pick(c) { hide(); submit(c.key); input.focus(); }
  function move(d) { if (!items.length) return; active = (active + d + items.length) % items.length; [...list.children].forEach((li, i) => li.setAttribute("aria-selected", i === active)); list.children[active].scrollIntoView({ block: "nearest" }); }
  input.addEventListener("input", show);
  input.addEventListener("focus", () => { if (input.value) show(); });
  input.addEventListener("blur", hide);
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
    else if (e.key === "Escape") hide();
  });
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (isDone()) return;
    const m = list.hidden ? matches(input.value) : items;
    const exact = countries.find((c) => c.search.includes(norm(input.value)));
    const choice = (!list.hidden && m[active]) || exact || m[0];
    if (!choice) { $("msg").textContent = input.value.trim() ? "That country is not on this map. Pick one from the list." : "Type a country name first."; return; }
    pick(choice);
  });
})();

/* ---------- Buttons ---------- */
$("mode-daily").addEventListener("click", () => { if (state.mode !== "daily") startDaily(); });
$("mode-practice").addEventListener("click", () => { if (state.mode !== "practice") startPractice(); });
$("again").addEventListener("click", startPractice);
$("copy").addEventListener("click", async () => {
  const text = shareText(), box = $("sharebox");
  try { await navigator.clipboard.writeText(text); $("copy").textContent = "Copied"; setTimeout(() => { $("copy").textContent = "Copy result"; }, 1600); }
  catch (e) { box.hidden = false; box.value = text; box.focus(); box.select(); }
});

/* ---------- Boot ---------- */
function start(snap) {
  fetch("world.json").then((r) => r.json()).then((world) => {
    const geoms = world.objects.countries.geometries.filter((g) => !SKIP.has(g.id));
    landGeo = topojson.merge(world, geoms);
    borderGeo = topojson.mesh(world, { type: "GeometryCollection", geometries: geoms }, (a, b) => a !== b);
    const feats = topojson.feature(world, world.objects.countries).features;
    countries = feats.filter((f) => !SKIP.has(f.id)).map((f) => {
      const key = f.id || f.properties.name, name = RENAME[f.properties.name] || f.properties.name;
      let main = f;
      if (f.geometry.type === "MultiPolygon") {
        let best = -1;
        for (const coords of f.geometry.coordinates) { const p = { type: "Polygon", coordinates: coords }, a = d3.geoArea(p); if (a > best) { best = a; main = p; } }
      }
      const search = [norm(name)].concat(ALIAS[key] ? ALIAS[key].split(" ").length > 3 ? splitAliases(ALIAS[key]) : ALIAS[key].split(" ") : []);
      if (ALIAS[key]) search.push(norm(ALIAS[key]));
      return { key, name, feature: f, center: d3.geoCentroid(main), search };
    }).sort((a, b) => a.name.localeCompare(b.name));
    byKey = new Map(countries.map((c) => [c.key, c]));
    answerPool = Object.keys(CASES).filter((k) => byKey.has(k)).sort();
    if (snap && snap.answer && byKey.has(snap.answer) && CASES[snap.answer]) { state = { mode: snap.mode, day: snap.day, answer: snap.answer, guesses: (snap.guesses || []).filter((k) => byKey.has(k)), fresh: -1 }; afterStart(); }
    else startDaily();
    resize();
  }).catch(() => { $("msg").textContent = "The map could not load. Reload the page to try again."; });
}
function splitAliases(s) {
  // multi-word aliases: keep known phrases together, plus single words
  const phrases = ["great britain", "democratic republic of the congo", "congo kinshasa", "congo brazzaville", "ivory coast", "czech republic", "korea republic", "east timor"];
  const out = []; let rest = s;
  for (const p of phrases) if (rest.includes(p)) { out.push(p); rest = rest.replace(p, " "); }
  return out.concat(rest.split(" ").filter(Boolean));
}
window.claude?.hot?.snapshot?.(() => state ? { mode: state.mode, day: state.day, answer: state.answer, guesses: state.guesses } : {});
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
